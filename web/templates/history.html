{% extends "base.html" %}
{% block title %}Historique{% endblock %}

{% block content %}
<div class="d-flex flex-wrap align-items-center gap-2 mb-4">
  <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i><span data-i18n="history.title">Historique des uploads</span></h5>
  <div class="ms-auto d-flex flex-wrap gap-2">
    <button class="btn btn-sm btn-outline-secondary" onclick="refreshHistory()">
      <i class="bi bi-arrow-clockwise me-1"></i><span data-i18n="common.refresh">Actualiser</span>
    </button>
    <a class="btn btn-sm btn-outline-success" href="/api/history/export.csv" download>
      <i class="bi bi-file-earmark-spreadsheet me-1"></i><span data-i18n="history.export_btn">Export CSV</span>
    </a>
    <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">
      <i class="bi bi-trash me-1"></i><span data-i18n="history.clear_btn">Effacer tout</span>
    </button>
  </div>
</div>

<!-- Summary badges -->
<div class="d-flex flex-wrap gap-2 mb-3" id="hist-summary"></div>

<!-- M: Quick-filter chips -->
<div class="d-flex flex-wrap gap-1 mb-2 align-items-center">
  <span class="text-muted small me-1" data-i18n="history.chips.status_label">Statut :</span>
  <button class="btn btn-xs btn-outline-secondary active" data-chip-status=""
          onclick="_setChip('status','',this)" data-i18n="history.filter.all_statuses">Tous</button>
  <button class="btn btn-xs btn-outline-success" data-chip-status="done"
          onclick="_setChip('status','done',this)" data-i18n="history.filter.status_done">Succès</button>
  <button class="btn btn-xs btn-outline-danger" data-chip-status="error"
          onclick="_setChip('status','error',this)" data-i18n="history.filter.status_error">Erreur</button>
  <span class="vr mx-1"></span>
  <span class="text-muted small me-1" data-i18n="history.chips.type_label">Type :</span>
  <button class="btn btn-xs btn-outline-secondary active" data-chip-type=""
          onclick="_setChip('type','',this)" data-i18n="history.filter.all_types">Tous</button>
  <button class="btn btn-xs btn-outline-warning text-dark" data-chip-type="file"
          onclick="_setChip('type','file',this)" data-i18n="history.type.file">FILE</button>
  <button class="btn btn-xs btn-outline-success" data-chip-type="season"
          onclick="_setChip('type','season',this)" data-i18n="history.type.season">SEASON</button>
  <button class="btn btn-xs btn-outline-info" data-chip-type="integrale"
          onclick="_setChip('type','integrale',this)" data-i18n="history.type.integrale">INTÉGRALE</button>
</div>

<!-- Filter bar -->
<div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
  <div class="input-group input-group-sm" style="max-width:280px">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input type="search" class="form-control" id="hist-search"
           placeholder="Rechercher…" oninput="_histFilterChanged()">
  </div>
  <select class="form-select form-select-sm" id="hist-filter-type" style="max-width:140px"
          onchange="_histFilterChanged(); _syncChips()">
    <option value="" data-i18n="history.filter.all_types">Tous types</option>
    <option value="file" data-i18n="history.type.file">FILE</option>
    <option value="season" data-i18n="history.type.season">SEASON</option>
    <option value="integrale" data-i18n="history.type.integrale">INTEGRAL</option>
  </select>
  <select class="form-select form-select-sm" id="hist-filter-status" style="max-width:140px"
          onchange="_histFilterChanged(); _syncChips()">
    <option value="" data-i18n="history.filter.all_statuses">Tous statuts</option>
    <option value="done" data-i18n="history.filter.status_done">Succès</option>
    <option value="error" data-i18n="history.filter.status_error">Erreur</option>
  </select>
  <input type="date" class="form-control form-control-sm" id="hist-date-from"
         style="max-width:145px" onchange="_histFilterChanged()"
         title="Depuis" data-i18n-title="history.filter.date_from">
  <input type="date" class="form-control form-control-sm" id="hist-date-to"
         style="max-width:145px" onchange="_histFilterChanged()"
         title="Jusqu'au" data-i18n-title="history.filter.date_to">
</div>

<!-- Table -->
<div class="table-responsive">
  <table class="table table-sm table-hover align-middle" id="hist-table">
    <thead class="table-dark">
      <tr>
        <th data-i18n="history.col.name">Nom</th>
        <th data-i18n="history.col.type">Type</th>
        <th data-i18n="history.col.tag">Tag</th>
        <th data-i18n="history.col.date">Traité le</th>
        <th data-i18n="history.col.upload">Upload</th>
        <th data-i18n="history.col.qbit">qBit</th>
        <th data-i18n="history.col.size">Taille</th>
        <th data-i18n="history.col.ratio">Ratio</th>
        <th data-i18n="history.col.speed">↑ Vitesse</th>
        <th data-i18n="history.col.json">JSON</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="hist-body">
      <tr><td colspan="11" class="text-center text-muted py-4">
        <i class="bi bi-hourglass-split me-2"></i><span data-i18n="common.loading">Chargement…</span>
      </td></tr>
    </tbody>
  </table>
</div>
<div id="hist-pagination" class="mt-3"></div>

<!-- Modal détail JSON + console -->
<div class="modal fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title font-mono text-truncate" id="detail-title"></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-header py-0 border-top-0 border-bottom">
        <ul class="nav nav-tabs card-header-tabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#detail-tab-json" type="button">
              <i class="bi bi-braces me-1"></i><span data-i18n="history.tab.json">JSON</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#detail-tab-console" type="button">
              <i class="bi bi-terminal me-1"></i><span data-i18n="history.tab.console">Console</span>
            </button>
          </li>
        </ul>
      </div>
      <div class="modal-body p-0 tab-content">
        <div class="tab-pane fade show active" id="detail-tab-json" role="tabpanel">
          <pre id="detail-json" class="terminal font-mono small mb-0 p-3"
               style="max-height:70vh;min-height:240px;white-space:pre-wrap;border-radius:0">{}</pre>
        </div>
        <div class="tab-pane fade" id="detail-tab-console" role="tabpanel">
          <div class="terminal font-mono small" id="detail-console"
               style="max-height:70vh;min-height:240px;border-radius:0"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
"use strict";

let _histPage  = 1;
let _histLimit = 50;
let _histTotal = 0;
let _histFilterTimer = null;

function _histFilterChanged() {
  clearTimeout(_histFilterTimer);
  _histFilterTimer = setTimeout(() => refreshHistory(1), 300);
}

async function refreshHistory(page) {
  page = page || 1;
  _histPage = page;
  const search  = document.getElementById("hist-search")?.value  || "";
  const ftype   = document.getElementById("hist-filter-type")?.value || "";
  const fstatus = document.getElementById("hist-filter-status")?.value || "";
  const dfrom   = document.getElementById("hist-date-from")?.value || "";
  const dto     = document.getElementById("hist-date-to")?.value || "";
  const params  = new URLSearchParams({ page, limit: _histLimit });
  if (search)  params.set("search",  search);
  if (ftype)   params.set("type",    ftype);
  if (fstatus) params.set("status",  fstatus);
  if (dfrom)   params.set("date_from", dfrom);
  if (dto)     params.set("date_to",   dto);
  const resp = await fetch(`/api/history?${params}`);
  const data = await resp.json();
  _histTotal = data.total ?? 0;
  renderHistory(data.rows || []);
  renderPagination(data);
}

function renderPagination(data) {
  const el = document.getElementById("hist-pagination");
  if (!el) return;
  const { page, pages, total, limit } = data;
  if (pages <= 1) { el.innerHTML = ""; return; }
  const prev = page > 1
    ? `<li class="page-item"><a class="page-link" href="#" onclick="refreshHistory(${page-1});return false">‹</a></li>` : "";
  const next = page < pages
    ? `<li class="page-item"><a class="page-link" href="#" onclick="refreshHistory(${page+1});return false">›</a></li>` : "";
  el.innerHTML = `<nav><ul class="pagination pagination-sm mb-0 justify-content-center">
    ${prev}
    <li class="page-item disabled"><span class="page-link">${page} / ${pages} (${total})</span></li>
    ${next}
  </ul></nav>`;
}

function renderHistory(rows) {
  const tbody = document.getElementById("hist-body");
  const done  = rows.filter(r => r.status === "done").length;
  const errs  = rows.filter(r => r.status === "error").length;

  document.getElementById("hist-summary").innerHTML = `
    <span class="badge bg-secondary fs-6">${t("history.badge.total", _histTotal)}</span>
    <span class="badge bg-success fs-6">${t("history.badge.ok", done)}</span>
    ${errs ? `<span class="badge bg-danger fs-6">${t("history.badge.errors", errs)}</span>` : ""}
  `;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="11" class="text-center text-muted py-5">
      <i class="bi bi-inbox fs-2 d-block mb-2"></i>${t("history.empty")}
    </td></tr>`;
    return;
  }

  const typeBadge = {
    integrale: "bg-info text-dark",
    season:    "bg-success",
    file:      "bg-warning text-dark",
    unknown:   "bg-secondary",
  };
  const typeKey = {
    integrale: "history.type.integrale",
    season:    "history.type.season",
    file:      "history.type.file",
    unknown:   "history.type.unknown",
  };

  tbody.innerHTML = rows.map(r => {
    const upBadge = r.status === "done"
      ? `<span class="badge bg-success">${t("history.upload.ok")}</span>`
      : r.status === "error"
      ? `<span class="badge bg-danger">${t("history.upload.error")}</span>`
      : `<span class="badge bg-secondary">${esc(r.status)}</span>`;

    const qbit = r.torrent;
    const qbitBadge = qbit
      ? `<span class="badge bg-${qbit.state_class}">${esc(qbit.state_label)}</span>`
      : `<span class="text-muted small">—</span>`;
    const sizeCell  = qbit ? qbit.size_human : "—";
    const ratioCell = qbit
      ? `<span class="${qbit.ratio >= 1 ? 'text-success' : 'text-warning'} fw-bold">${qbit.ratio}</span>`
      : "—";
    const speedCell = qbit && qbit.upload_speed > 0
      ? `<span class="text-info font-mono">${qbit.upload_speed_human}</span>`
      : "—";

    const jsonCell = (r.has_detail || r.has_result)
      ? `<button class="btn btn-xs btn-outline-info py-0 px-2"
                data-job-id="${esc(r.job_id)}" data-job-name="${esc(r.name)}"
                onclick="showHistoryDetail(this.dataset.jobId, this.dataset.jobName)"
                title="${t('history.btn.json_title')}">
           <i class="bi bi-braces"></i>
         </button>`
      : `<span class="text-muted small">—</span>`;

    const dt = r.processed_at
      ? new Date(r.processed_at).toLocaleString(i18n.dateLocale())
      : "—";

    const expandRow = r.job_id
      ? `<tr id="expand-${esc(r.job_id)}" class="transcript-row d-none bg-body-tertiary">
           <td colspan="11" class="p-2"><div class="transcript-content"></div></td>
         </tr>`
      : "";
    const rowStyle = r.job_id ? ' style="cursor:pointer"' : "";
    return `<tr data-job-id="${esc(r.job_id || '')}"${rowStyle}>
      <td class="font-mono small text-truncate" style="max-width:260px" title="${esc(r.path)}">${esc(r.name)}</td>
      <td><span class="badge ${typeBadge[r.type] || 'bg-secondary'}">${t(typeKey[r.type] || "history.type.unknown")}</span></td>
      <td><span class="badge bg-dark border font-mono">${esc(r.tag || "—")}</span></td>
      <td class="small text-nowrap">${dt}</td>
      <td>${upBadge}</td>
      <td>${qbitBadge}</td>
      <td class="small text-nowrap">${sizeCell}</td>
      <td class="small">${ratioCell}</td>
      <td class="small text-nowrap">${speedCell}</td>
      <td class="text-center">${jsonCell}</td>
      <td class="text-nowrap">
        <button class="btn btn-xs btn-outline-primary py-0 px-1 me-1"
                data-path="${esc(r.path)}"
                onclick="recheckItem(this.dataset.path, this)"
                title="${t('history.btn.recheck_title')}">
          <i class="bi bi-cloud-check"></i>
        </button>
        <button class="btn btn-xs btn-outline-warning py-0 px-1"
                data-path="${esc(r.path)}"
                onclick="removeItem(this.dataset.path)"
                title="${t('history.btn.remove_title')}">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </td>
    </tr>${expandRow}`;
  }).join("");
}

async function removeItem(path) {
  await fetch("/api/history/item", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path }),
  });
  showToast(t("history.toast.removed"), "success");
  refreshHistory();
}

async function clearHistory() {
  if (!confirm(t("history.confirm.clear"))) return;
  await fetch("/api/history", { method: "DELETE" });
  showToast(t("history.toast.cleared"), "success");
  refreshHistory();
}

async function showHistoryDetail(jobId, name) {
  const title = document.getElementById("detail-title");
  const jsonEl = document.getElementById("detail-json");
  const conEl  = document.getElementById("detail-console");
  title.textContent = name;
  jsonEl.textContent = t("common.loading");
  conEl.textContent  = "";
  bootstrap.Modal.getOrCreateInstance(document.getElementById("detail-modal")).show();

  try {
    const resp = await fetch(`/api/history/detail/${encodeURIComponent(jobId)}`);
    if (!resp.ok) {
      jsonEl.textContent = t("history.json.empty");
      return;
    }
    const data = await resp.json();
    // JSON complet de l'enregistrement (sans masquer result)
    jsonEl.textContent = JSON.stringify(data, null, 2);
    conEl.textContent  = data.transcript || t("history.console.empty");
  } catch {
    jsonEl.textContent = t("history.json.empty");
  }
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])
  );
}

// ── M: Quick-filter chip helpers ──────────────────────────────────────────
function _setChip(field, value, btn) {
  const selId = field === "status" ? "hist-filter-status" : "hist-filter-type";
  const sel   = document.getElementById(selId);
  if (sel) sel.value = value;
  document.querySelectorAll(`[data-chip-${field}]`).forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  _histFilterChanged();
}

/** Keep chips in sync when the select changes directly. */
function _syncChips() {
  const typeVal   = document.getElementById("hist-filter-type")?.value   || "";
  const statusVal = document.getElementById("hist-filter-status")?.value || "";
  document.querySelectorAll("[data-chip-type]").forEach(c => {
    c.classList.toggle("active", c.dataset.chipType === typeVal);
  });
  document.querySelectorAll("[data-chip-status]").forEach(c => {
    c.classList.toggle("active", c.dataset.chipStatus === statusVal);
  });
}

// ── O: Re-check against tracker ──────────────────────────────────────────
async function recheckItem(path, btn) {
  if (btn) btn.disabled = true;
  try {
    const resp = await fetch("/api/history/recheck", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ paths: [path] }),
    });
    const data = await resp.json();
    const result = data.results?.[0];
    if (!result) { showToast(t("history.toast.recheck_error"), "danger"); return; }
    const name = path.split(/[\\/]/).pop();
    if (result.status === "duplicate") {
      showToast(t("history.toast.recheck_duplicate", name), "warning");
    } else if (result.status === "ok") {
      showToast(t("history.toast.recheck_ok"), "success");
    } else {
      showToast(t("history.toast.recheck_error") + (result.detail ? ": " + result.detail : ""), "danger");
    }
  } catch {
    showToast(t("history.toast.recheck_error"), "danger");
  } finally {
    if (btn) btn.disabled = false;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const _urlQ = new URLSearchParams(window.location.search).get("search");
  if (_urlQ) {
    const _inp = document.getElementById("hist-search");
    if (_inp) _inp.value = _urlQ;
  }
  refreshHistory();
  // Feature 5: delegated click for inline transcript
  document.getElementById("hist-body").addEventListener("click", async (e) => {
    const tr = e.target.closest("tr[data-job-id]");
    if (!tr || e.target.closest("button, a")) return;
    const jobId = tr.dataset.jobId;
    if (!jobId) return;
    const expandTr = document.getElementById(`expand-${jobId}`);
    if (!expandTr) return;
    const isOpen = !expandTr.classList.contains("d-none");
    // Close all
    document.querySelectorAll(".transcript-row").forEach(el => el.classList.add("d-none"));
    document.querySelectorAll("tr[data-job-id]").forEach(el => el.classList.remove("table-active"));
    if (!isOpen) {
      expandTr.classList.remove("d-none");
      tr.classList.add("table-active");
      const content = expandTr.querySelector(".transcript-content");
      if (!content.dataset.loaded) {
        content.innerHTML = `<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-primary"></div></div>`;
        try {
          const r = await fetch(`/api/history/detail/${jobId}`);
          const d = await r.json();
          const transcript = d.transcript || "";
          const lines = transcript.split("\n").filter(Boolean);
          content.innerHTML = lines.length
            ? `<pre class="terminal font-mono small mb-0 p-2" style="max-height:200px;overflow-y:auto;white-space:pre-wrap">${esc(lines.join("\n"))}</pre>`
            : `<span class="text-muted small fst-italic">${t("history.transcript.empty") || "Aucun transcript"}</span>`;
          content.dataset.loaded = "1";
        } catch {
          content.innerHTML = `<span class="text-danger small">${t("history.json.empty")}</span>`;
        }
      }
    }
  });
});
document.addEventListener("locale-changed", refreshHistory);
setInterval(refreshHistory, 30000);
</script>
{% endblock %}
