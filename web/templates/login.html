<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit3Dup — Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function(){
      const t = localStorage.getItem("u3d-theme") || "dark";
      document.getElementById("html-root").setAttribute("data-bs-theme", t);
    })();
  </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-lg" style="width:100%;max-width:380px">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-cloud-upload-fill text-primary fs-1"></i>
      <h4 class="mt-2 mb-0 fw-bold">Unit3Dup WEB</h4>
      <small class="text-muted" data-i18n="auth.subtitle">Connexion requise</small>
    </div>

    <div id="alert-box" class="alert d-none mb-3 py-2" role="alert"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="mb-3">
        <label class="form-label small fw-semibold" data-i18n="auth.password_label">Mot de passe</label>
        <div class="input-group">
          <input type="password" id="pwd-input" class="form-control"
                 autocomplete="current-password" autofocus required>
          <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label small" for="remember" data-i18n="auth.remember">Se souvenir de moi</label>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btn-login">
        <span id="btn-login-text" data-i18n="auth.login_btn">Se connecter</span>
        <span id="btn-login-spin" class="d-none spinner-border spinner-border-sm ms-1"></span>
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/i18n.js"></script>
<script>
function togglePwd() {
  const inp  = document.getElementById("pwd-input");
  const icon = document.getElementById("eye-icon");
  if (inp.type === "password") {
    inp.type = "text";
    icon.className = "bi bi-eye-slash";
  } else {
    inp.type = "password";
    icon.className = "bi bi-eye";
  }
}

// ── Show contextual message when redirected after an auto-logout ─────────────
(function () {
  const reason = new URLSearchParams(window.location.search).get("reason");
  if (!reason) return;
  const box = document.getElementById("alert-box");
  box.className = "alert alert-warning mb-3 py-2";
  box.textContent = reason === "timeout" ? t("config.security.session_expired_timeout")
                  : reason === "restart" ? t("config.security.session_expired_restart")
                  : "";
  if (box.textContent) box.classList.remove("d-none");
})();

async function doLogin(e) {
  e.preventDefault();
  const btn  = document.getElementById("btn-login");
  const spin = document.getElementById("btn-login-spin");
  const box  = document.getElementById("alert-box");
  btn.disabled = true;
  spin.classList.remove("d-none");
  box.classList.add("d-none");

  const resp = await fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      password: document.getElementById("pwd-input").value,
      remember: document.getElementById("remember").checked,
    }),
  });

  btn.disabled = false;
  spin.classList.add("d-none");

  if (resp.ok) {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get("next") || "/";
    return;
  }

  const data = await resp.json().catch(() => ({}));
  box.classList.remove("d-none", "alert-danger", "alert-warning");
  if (data.error === "too_many_attempts") {
    box.classList.add("alert-warning");
    box.textContent = t("auth.error.too_many_attempts");
  } else {
    box.classList.add("alert-danger");
    box.textContent = t("auth.error.wrong_password");
    document.getElementById("pwd-input").value = "";
    document.getElementById("pwd-input").focus();
  }
}
</script>
</body>
</html>
