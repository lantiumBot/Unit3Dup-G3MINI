<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit3Dup — {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    // Apply saved theme before render to avoid flash
    (function(){
      const t = localStorage.getItem("u3d-theme") || "dark";
      document.getElementById("html-root").setAttribute("data-bs-theme", t);
    })();
  </script>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top px-3 px-md-4">
  <a class="navbar-brand fw-bold text-primary text-decoration-none me-3" href="/">
    <i class="bi bi-cloud-upload-fill me-1"></i>
    <span class="d-none d-sm-inline">Unit3Dup WEB</span>
  </a>

  <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto gap-1">
      <li class="nav-item">
        <a href="/" class="btn btn-sm {% if page=='jobs' %}btn-primary{% else %}btn-outline-secondary{% endif %} d-flex align-items-center gap-1">
          <i class="bi bi-play-circle-fill"></i>
          <span data-i18n="nav.jobs">Jobs</span>
          {% if page=='jobs' %}<span class="badge bg-light text-dark d-none" id="badge-running">0</span>{% endif %}
        </a>
      </li>
      <li class="nav-item">
        <a href="/history" class="btn btn-sm {% if page=='history' %}btn-primary{% else %}btn-outline-secondary{% endif %} d-flex align-items-center gap-1">
          <i class="bi bi-clock-history"></i>
          <span data-i18n="nav.history">Historique</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/stats" class="btn btn-sm {% if page=='stats' %}btn-primary{% else %}btn-outline-secondary{% endif %} d-flex align-items-center gap-1">
          <i class="bi bi-bar-chart-line-fill"></i>
          <span data-i18n="nav.stats">Stats</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/status" class="btn btn-sm {% if page=='status' %}btn-primary{% else %}btn-outline-secondary{% endif %} d-flex align-items-center gap-1">
          <i class="bi bi-activity"></i>
          <span data-i18n="nav.status">Status</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/config" class="btn btn-sm {% if page=='config' %}btn-primary{% else %}btn-outline-secondary{% endif %} d-flex align-items-center gap-1">
          <i class="bi bi-gear-fill"></i>
          <span data-i18n="nav.config">Config</span>
        </a>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
      {% if page=='jobs' %}<span id="conn-dot" class="badge bg-danger" data-i18n="nav.disconnected">⬤ Déconnecté</span>{% endif %}

      <!-- ── Language selector ───────────────────────────────────────────── -->
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle px-2" type="button"
                data-bs-toggle="dropdown" data-i18n-title="nav.lang_title" title="Langue">
          <span id="lang-flag">🇫🇷</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" onclick="i18n.setLang('fr');return false">🇫🇷 Français</a></li>
          <li><a class="dropdown-item" href="#" onclick="i18n.setLang('en');return false">🇬🇧 English</a></li>
          <li><a class="dropdown-item" href="#" onclick="i18n.setLang('es');return false">🇪🇸 Español</a></li>
          <li><a class="dropdown-item" href="#" onclick="i18n.setLang('it');return false">🇮🇹 Italiano</a></li>
          <li><a class="dropdown-item" href="#" onclick="i18n.setLang('de');return false">🇩🇪 Deutsch</a></li>
        </ul>
      </div>

      <!-- ── Theme toggle ────────────────────────────────────────────────── -->
      <button class="btn btn-sm btn-outline-secondary" id="theme-btn" onclick="toggleTheme()"
              data-i18n-title="nav.theme_title" title="Thème clair/sombre">
        <i class="bi bi-sun-fill" id="theme-icon"></i>
      </button>
    </div>
  </div>
</nav>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive">
    <div class="d-flex">
      <div class="toast-body fw-semibold" id="toast-body"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- ── Content ────────────────────────────────────────────────────────────── -->
<div class="container-fluid py-3 py-md-4 px-3 px-md-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/i18n.js"></script>
<script>
  // ── Theme toggle ─────────────────────────────────────────────────────────
  function _applyTheme(t) {
    document.getElementById("html-root").setAttribute("data-bs-theme", t);
    const icon = document.getElementById("theme-icon");
    if (icon) icon.className = t === "dark" ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
    localStorage.setItem("u3d-theme", t);
  }
  function toggleTheme() {
    const cur = document.getElementById("html-root").getAttribute("data-bs-theme");
    _applyTheme(cur === "dark" ? "light" : "dark");
  }
  document.addEventListener("DOMContentLoaded", () => {
    _applyTheme(localStorage.getItem("u3d-theme") || "dark");
  });

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, type = "info") {
    const el = document.getElementById("toast");
    el.className = `toast align-items-center text-bg-${type} border-0`;
    document.getElementById("toast-body").textContent = msg;
    bootstrap.Toast.getOrCreateInstance(el, { delay: 3500 }).show();
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
